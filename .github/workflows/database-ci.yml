name: Database CI

on:
  push:
    paths:
      - "01-db-design/**"
      - "02-secure-devops-api/**"
      - ".github/workflows/database-ci.yml"

  pull_request:
    paths:
      - "01-db-design/**"
      - "02-secure-devops-api/**"
      - ".github/workflows/database-ci.yml"

permissions:
  contents: read

jobs:
  build-database:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build database project
        shell: pwsh
        run: ./02-secure-devops-api/scripts/build-database.ps1

      - name: Upload DACPAC artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-dacpac
          path: 01-db-design/SupportKnowledgePlatform/bin/Debug/SupportKnowledgePlatform.dacpac

  verify-azure-login:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    needs: build-database

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify Azure SQL token acquisition
        shell: pwsh
        run: |
          $token = az account get-access-token `
            --resource https://database.windows.net/ `
            --query accessToken `
            --output tsv

          if (-not $token) {
            throw "Failed to acquire Azure SQL access token."
          }

          Write-Host "Azure SQL access token acquired successfully."

      - name: Open temporary SQL firewall rule
        shell: pwsh
        run: ./02-secure-devops-api/scripts/network/open-ci-sql-firewall.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install SqlPackage
        shell: pwsh
        run: dotnet tool install --global Microsoft.SqlPackage

      - name: Download DACPAC artifact
        uses: actions/download-artifact@v4
        with:
          name: database-dacpac
          path: 01-db-design/SupportKnowledgePlatform/bin/Debug

      - name: Generate deployment report
        shell: pwsh
        env:
          AZURE_SQL_SERVER: ${{ vars.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ vars.AZURE_SQL_DATABASE }}
        run: ./02-secure-devops-api/scripts/generate-deployment-report.ps1

      - name: Close temporary SQL firewall rule
        if: always()
        shell: pwsh
        run: ./02-secure-devops-api/scripts/network/close-ci-sql-firewall.ps1